# abs-webnovel + Byparr stack.
#
# Configuration lives in `.env` (see `.env.example`). It is used both for
# ${VAR} interpolation below (host ports) and passed to both containers
# via `env_file`.
services:
  abs-webnovel:
    build: .
    image: abs-webnovel:latest
    container_name: abs-webnovel
    env_file: .env
    environment:
      # In-stack address of Byparr (overrides BYPARR_URL from .env).
      BYPARR_URL: http://byparr:8191
    ports:
      - "${WEBNOVEL_PORT:-8080}:8080"
    volumes:
      - abs-webnovel-cache:/app/cache
    depends_on:
      - byparr
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cloudflare bypass for the NovelUpdates source.
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    env_file: .env
    ports:
      - "${BYPARR_PORT:-8191}:8191"
    shm_size: "1gb"
    tmpfs:
      - /tmp:exec,mode=1777,size=1G
      # Must fit the extracted Camoufox browser bundle (~1 GB).
      # `exec` is required: the browser binary is spawned from this mount.
      - /cache:exec,mode=1777,size=2G
    restart: unless-stopped

volumes:
  abs-webnovel-cache:
